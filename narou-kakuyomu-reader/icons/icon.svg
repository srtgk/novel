<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b70e0" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 背景角丸スクエア -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />

  <!-- メインアイコン: 開いた本とスマートフォン/スワイプ矢印のモチーフ -->
  <g filter="url(#shadow)" transform="translate(64, 64) scale(0.75)">
    <!-- 開いた本 -->
    <path d="M70 120 C140 100 220 115 256 140 C292 115 372 100 442 120 L442 380 C372 360 292 375 256 400 C220 375 140 360 70 380 Z" 
          fill="#ffffff" />
    
    <!-- 背表紙の折り目 -->
    <path d="M256 140 L256 400" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>

    <!-- 本のページ線（左側） -->
    <line x1="110" y1="180" x2="220" y2="170" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="230" x2="220" y2="220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="110" y1="280" x2="190" y2="270" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- 本のページ線（右側） -->
    <line x1="292" y1="170" x2="402" y2="180" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="292" y1="220" x2="402" y2="230" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="292" y1="270" x2="372" y2="280" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- カクヨム風の引き上げスワイプ矢印バッジ -->
    <circle cx="256" cy="380" r="54" fill="#f59e0b" stroke="#ffffff" stroke-width="8"/>
    <path d="M256 355 L236 385 L276 385 Z" fill="#ffffff" />
    <line x1="256" y1="385" x2="256" y2="405" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
